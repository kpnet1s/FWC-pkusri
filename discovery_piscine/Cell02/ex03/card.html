<!DOCTYPE html>
<html>

<head>
    <title>Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>

<body>

    <div class="card">

        <div class="header">My Profile</div>

        <table>
            <tr>
                <td>
                    <img class="profile"
                        src="https://static.wikia.nocookie.net/eldenring/images/5/59/ER_Ranni_%28square_portrait%29.png"
                        alt="Profile Picture">
                </td>
            </tr>

            <tr>
                <td class="login">
                    kpnets
                </td>
            </tr>

            <tr>
                <td class="description">
                    Kmitl Student
                </td>
            </tr>

            <tr>
                <td class="social">
                    <a>
                        <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
                            alt="GitHub">
                    </a>

                    <a>
                        <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/Facebook_icon.svg"
                            alt="Facebook">
                    </a>

                    <a>
                        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png"
                            alt="Instagram">
                    </a>
                </td>
            </tr>

            <tr>
                <td>
                    <a class="contact"
                        href="https://youtu.be/dQw4w9WgXcQ?si=rKr9qIBbm530GLUq">
                        Contact
                    </a>
                </td>
            </tr>
        </table>

    </div>

</body>

</html>
