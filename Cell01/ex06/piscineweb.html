<html>
<head>
    <title>Two Boxes</title>
    <style>
    	* {
        	box-sizing: border-box;
    	}

    	html, body {
        	margin: 0;
        	padding: 0;
        	width: 100%;
		height: 100%;
    	}

    	table {
        	width: 100%;
        	border-collapse: collapse;
        	table-layout: fixed;
		height: 100%;
    	}

    	th, td {
        	border: 1px solid black;
        	padding: 10px;
        	text-align: center;
        	word-wrap: break-word;
    	}
    </style>
</head>

<body>

    <table style="width: 100%; border-collapse: collapse;">
        <tr>
            <td style="background-color: lightgreen; height: 100px;">
                First cell
            </td>

            <td style="background-color: lightcoral; height: 100px;">
                Second cell
            </td>
        </tr>
    </table>

</body>
</html>
