<!DOCTYPE html> 
<html> 
<head>
	<title>Parallax</title> 
	<style> 
		html, body {
			margin: 0; padding: 0;
		}
		.image1 {
			height: 100vh;
			background-image: url("https://pngimg.com/uploads/linux/linux_PNG29.png");
			background-size: cover;
			background-position: center;
			background-attachment: fixed;
			display: flex;
			justify-content: center;
			align-items: center;
		}
		.image2 {
			height: 100vh;
			background-image: url("https://cdn.mos.cms.futurecdn.net/5qaXNDdd3XXwLGabg6j454-750-80.jpg");
			background-size: cover;
			background-position: center;
			background-attachment: fixed;
			display: flex;
			justify-content: center;
			align-items: center;
		}
		.message {
			background-color: rgba(0, 0, 0, 0.6);
			color: white; padding: 20px 40px;
			font-size: 18px;
		}
		.black-block {
			height: 300px;
			background-color: black;
			color: white;
			display: flex;
			justify-content: center;
			align-items: center;
			font-size: 30px;
			text-align: center;
		}
	</style>
</head>
<body>
	<div class="image1">
		<div class="message">
			Welcome to linux
		</div>
	</div>
	<div class="black-block">
		This is linux interface
	</div>
	<div class="image2">
		<div class="message">
			Thanks for visiting!'o'
		</div>
	</div>
</body>
</html>
