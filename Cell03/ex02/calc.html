<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
    <link rel="stylesheet" href="calc.css">
</head>

<body>

    <div class="calculator">
        <input type="text" id="left">

        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="%">%</option>
        </select>

        <input type="text" id="right">

        <input type="submit" value="Try me!" id="calculate">
    </div>

    <script src="calc.js"></script>
</body>
</html>
