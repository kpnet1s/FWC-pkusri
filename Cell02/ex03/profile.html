<!DOCTYPE html>
<html>
<head>
	<title>Profile Card</title>
	<style> 
		body {
			margin: 0;
			background-color: lightgray;
			font-family: Arial, sans-serif;
		}
		.card {
			width: 350px;
			margin: 100px auto;
			background-color: white;
			text-align: center;
			padding-bottom: 25px;
		}
		.header {
			background-color: black;
			padding: 20px;
			font-size: 24px;
			color: white;
			font-weight: bold;
		}
		.profile {
			width: 120px;
			height: 120px;
			border-radius: 50%;
			margin-top: 25px;
		}
		table {
			width: 100%;
			border-collapse: collapse;
		}
		td {
			text-align: center;
		}
		.login {
			font-size: 22px;
			font-weight: bold;
			padding-top: 15px;
		}
		.description {
			color: gray;
			padding: 10px;
		}
		.social img {
			width: 35px;
			height: 35px;
			margin: 5px;
		}
		.contact {
			display: inline-block;
			margin-top: 20px;
			padding: 10px 30px;
			background-color: black;
			color: white;
			text-decoration: none;
			border-radius: 5px;
		}
	</style>
</head>
<body>
	<div class="card">
		<div class="header"> My Profile </div>
		<table> 
			<tr> <td> 
				<img class="profile" src="https://static.wikia.nocookie.net/eldenring/images/5/59/ER_Ranni_%28square_portrait%29.png" alt="Profile Picture">
			</td> </tr>
			<tr> <td class="login">  
				kpnets
			</td> </tr>
			<tr> <td class="description">
				Kmitl Student
			</td> </tr>
			<tr> <td class="social">
				<a>
					<img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="GitHub">
				</a>
				<a>
					<img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/Facebook_icon.svg" alt="Facebook">
				</a>
				<a>
					<img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram">
				</a> 
			</td> </tr>
			<tr> <td> 
				<a class="contact" href="https://youtu.be/dQw4w9WgXcQ?si=rKr9qIBbm530GLUq">
					Contact
				</a>
			</td> </tr>
		</table>
	</div>
</body>
</html>
