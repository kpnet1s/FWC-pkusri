<!DOCTYPE html>

<html lang="en"> <head> <meta charset="UTF-8"> <title>SNCF Sandwich</title>

<style>
    body {
        margin: 0;
        background-color: #f2f2f2;
        font-family: Arial, sans-serif;
    }

    .menu {
        width: 350px;
        margin: 100px auto;
        padding: 30px;
        background-color: white;
        border: 2px solid #e30613;
        border-radius: 15px;
        text-align: center;
    }

    h1 {
        color: #e30613;
        margin-bottom: 10px;
    }

    p {
        color: #555;
    }

    select {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        border: 2px solid #e30613;
        border-radius: 8px;
        background-color: white;
        cursor: pointer;
    }

    option {
        padding: 10px;
    }
</style>

</head>

<body>

<div class="menu">
    <h1>Which one of these two train will be the furthest away from Paris when they will cross
path?</h1>

    <p>Choose your train</p>

    <select>
        <option>A Train</option>
        <option>Another Train</option>
    </select>
</div>

</body> </html>
