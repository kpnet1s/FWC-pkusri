<!DOCTYPE html>
<html>
<head>
	<title>Random Color</title>
</head>
<body>
	<button onclick="changeColor()">Click Me!!!</button>
	<script> 
		function changeColor() {
			let color = "#" + Math.floor(Math.random() * 16777215).toString(16);
			document.body.style.backgroundColor = color;
		}
	</script>
</body>
</html>
